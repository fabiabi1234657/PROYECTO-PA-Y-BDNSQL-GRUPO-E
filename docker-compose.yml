version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: facturacion-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: facturacion_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: facturacion-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  cassandra:
    image: cassandra:4.1
    container_name: facturacion-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=facturacion-cluster
      - CASSANDRA_DC=datacenter1
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10

  # ---- Apache Druid (cluster minimo) ----
  druid-postgres:
    image: postgres:15
    container_name: druid-postgres
    environment:
      POSTGRES_PASSWORD: FoolishPassword
      POSTGRES_USER: druid
      POSTGRES_DB: druid
    volumes:
      - druid_metadata:/var/lib/postgresql/data

  druid-zookeeper:
    image: zookeeper:3.5.10
    container_name: druid-zookeeper
    environment:
      ZOO_MY_ID: 1

  druid-coordinator:
    image: apache/druid:31.0.0
    container_name: druid-coordinator
    command: ["coordinator"]
    env_file: druid.env
    depends_on: [druid-zookeeper, druid-postgres]
    ports:
      - "8081:8081"
    volumes:
      - druid_shared:/opt/shared

  druid-broker:
    image: apache/druid:31.0.0
    container_name: druid-broker
    command: ["broker"]
    env_file: druid.env
    depends_on: [druid-zookeeper, druid-postgres, druid-coordinator]
    ports:
      - "8082:8082"

  druid-historical:
    image: apache/druid:31.0.0
    container_name: druid-historical
    command: ["historical"]
    env_file: druid.env
    depends_on: [druid-zookeeper, druid-postgres, druid-coordinator]
    volumes:
      - druid_shared:/opt/shared

  druid-middlemanager:
    image: apache/druid:31.0.0
    container_name: druid-middlemanager
    command: ["middleManager"]
    env_file: druid.env
    depends_on: [druid-zookeeper, druid-postgres, druid-coordinator]
    volumes:
      - druid_shared:/opt/shared

  druid-router:
    image: apache/druid:31.0.0
    container_name: druid-router
    command: ["router"]
    env_file: druid.env
    depends_on: [druid-zookeeper, druid-postgres, druid-coordinator]
    ports:
      - "8888:8888"

volumes:
  druid_metadata:
  druid_shared:
  mysql_data:
  mongo_data:
  cassandra_data:
