version: '3.8'

services:
  # ---- MySQL para Facturas ----
  mysql:
    image: mysql:8.0
    container_name: facturacion-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: facturacion_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- MongoDB para Productos ----
  mongodb:
    image: mongo:7.0
    container_name: facturacion-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # ---- Cassandra para Personas ----
  cassandra:
    image: cassandra:4.1
    container_name: facturacion-cassandra
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=facturacion-cluster
      - CASSANDRA_DC=datacenter1
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "describe keyspaces"]
      interval: 30s
      timeout: 10s
      retries: 10

volumes:
  mysql_data:
  mongo_data:
  cassandra_data:
