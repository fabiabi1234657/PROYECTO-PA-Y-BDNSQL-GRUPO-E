server:
  port: 8080

spring:
  application:
    name: facturacion-it

  data:
    mongodb:
      uri: mongodb://localhost:27017/facturacion_db
      database: facturacion_db

  cassandra:
    contact-points: 127.0.0.1
    port: 9042
    keyspace-name: facturacion_ks
    local-datacenter: datacenter1
    schema-action: CREATE_IF_NOT_EXISTS

  datasource:
    url: jdbc:mysql://localhost:3306/facturacion_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.facturacion: DEBUG
    org.springframework.data.mongodb: INFO
    org.springframework.data.cassandra: INFO
